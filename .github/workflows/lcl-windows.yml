name: LCL Windows

on:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Run the self-hosted Windows 10/11 release gate
        type: boolean
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  LCL_TOOLCHAIN_ROOT: '${{ github.workspace }}\build\tools\lcl-toolchain'

jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-10-x64, windows-11-x64]
    runs-on: [self-hosted, windows, x64, "${{ matrix.runner }}"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/runtime/embedded/xray/bridge/go.sum
      - name: Bootstrap pinned LCL toolchain
        shell: pwsh
        run: .\prototypes\lcl\bootstrap-toolchain.ps1 -ToolRoot $env:LCL_TOOLCHAIN_ROOT
      - name: Build, test and package
        working-directory: prototypes/lcl
        shell: pwsh
        run: |
          .\build.ps1
          .\test.ps1
          .\test-known-cores.ps1
          .\package.ps1
