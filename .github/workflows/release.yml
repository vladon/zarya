name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signing-input-artifact-id: ${{ steps.upload-signing-input.outputs.artifact-id }}
    env:
      QT_VERSION: "6.8.3"
      QT_STATIC_DIR: 'C:\Qt\Static\6.8.3\msvc2022_64'
      QT_STATIC_CACHE_KEY: qt-static-6.8.3-msvc2022_64-v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: src/runtime/embedded/xray/bridge/go.sum
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl 7zip -y --no-progress
          $roots = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL',
            'C:\OpenSSL-Win64'
          )
          $found = $null
          foreach ($r in $roots) {
            if (Test-Path "$r\include\openssl\ssl.h") {
              $found = $r
              "OPENSSL_ROOT_DIR=$r" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "OPENSSL_ROOT_DIR=$r"
              break
            }
          }
          if (-not $found) {
            throw 'OpenSSL headers not found after choco install'
          }
      - name: Restore static Qt cache
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: ${{ env.QT_STATIC_CACHE_KEY }}
      - name: Download static Qt release asset
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ci-qt-static-$env:QT_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP "qt-static-$env:QT_VERSION-msvc2022_64.7z"
          $destParent = Split-Path -Parent $env:QT_STATIC_DIR
          New-Item -ItemType Directory -Force -Path $destParent | Out-Null
          gh release download $tag -p "qt-static-$env:QT_VERSION-msvc2022_64.7z" -O $archive
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
            throw "Static Qt asset missing (release $tag). Bootstrap: Actions → Qt static Windows"
          }
          $seven = "${env:ProgramFiles}\7-Zip\7z.exe"
          & $seven x $archive "-o$destParent" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:QT_STATIC_DIR 'lib\cmake\Qt6\Qt6Config.cmake'))) {
            throw "Extracted static Qt incomplete at $($env:QT_STATIC_DIR)"
          }
      - name: Save static Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: ${{ env.QT_STATIC_CACHE_KEY }}
      - name: Enable MSVC developer environment
        shell: pwsh
        run: .\scripts\setup-msvc-actions.ps1
      - name: Install Ninja
        run: choco install ninja mingw -y --no-progress
      - name: Verify vendored Xray bridge
        working-directory: src/runtime/embedded/xray/bridge
        shell: pwsh
        run: |
          $gcc = Get-ChildItem 'C:\ProgramData\chocolatey\lib\mingw\tools\install' -Recurse -Filter x86_64-w64-mingw32-gcc.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $gcc) { throw 'MinGW-w64 GCC was not installed for the embedded Xray Go bridge.' }
          $env:CC = $gcc
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DZARYA_STATIC_QT=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_STATIC_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --target zarya_lrelease zarya zarya-helper zarya_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package unsigned staging
        run: .\scripts\package-windows.ps1 -Configuration Release -OutputDir dist -SkipBuild -SkipSigning
      - name: Verify unsigned staging artifact
        run: python scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Audit unsigned staging artifact secrets
        run: python scripts/audit-release-artifact.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip
      - name: Upload unsigned release artifacts
        if: vars.SIGNPATH_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-windows-release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload SignPath staging input
        id: upload-signing-input
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-windows-signing-input
          path: dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable/**
          if-no-files-found: error
          retention-days: 1

  release-windows-sign:
    if: vars.SIGNPATH_ENABLED == 'true'
    needs: release-windows
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v5
      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected SignPath setting: $name"
            }
          }
      - name: Submit origin-verified SignPath request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.release-windows.outputs.signing-input-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-output/Zarya-${{ needs.release-windows.outputs.version }}-windows-x64-portable
          parameters: |
            version: ${{ toJSON(needs.release-windows.outputs.version) }}
      - name: Finalize and verify signed package
        shell: pwsh
        run: |
          .\scripts\finalize-signpath-windows.ps1 `
            -StagingDir "dist/signpath-output/Zarya-${{ needs.release-windows.outputs.version }}-windows-x64-portable" `
            -OutputDir dist
      - name: Audit signed release artifact secrets
        run: python scripts/audit-release-artifact.py --artifact dist/Zarya-${{ needs.release-windows.outputs.version }}-windows-x64-portable.zip
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarya-windows-release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: src/runtime/embedded/xray/bridge/go.sum
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev zlib1g-dev libjpeg-dev libgl1-mesa-dev libegl1-mesa-dev \
            libglib2.0-dev libglib2.0-bin libdbus-1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-cursor0 libxcb-xinerama0 \
            gobject-introspection libgirepository1.0-dev \
            libboost-dev pkg-config libkf5config-bin dbus-x11 \
            cmake ninja-build build-essential xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
      - name: Check translations
        run: python3 scripts/check-translations.py
      - name: Verify vendored Xray bridge
        working-directory: src/runtime/embedded/xray/bridge
        run: go mod verify && go test ./...
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target zarya zarya_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native KDE proxy smoke
        run: ./scripts/run-kde-proxy-smoke.sh build
      - name: Package
        run: ./scripts/package-linux.sh --skip-build --skip-signing
      - name: Verify release artifact
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Audit release artifact secrets
        run: python3 scripts/audit-release-artifact.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarya-linux-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS.txt

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: src/runtime/embedded/xray/bridge/go.sum
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL / cmake / ninja
        run: brew install cmake ninja openssl@3
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
      - name: Check translations
        run: python3 scripts/check-translations.py
      - name: Verify vendored Xray bridge
        working-directory: src/runtime/embedded/xray/bridge
        run: go mod verify && go test ./...
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build --target zarya zarya_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: ./scripts/package-macos.sh --skip-build --skip-signing
      - name: Verify release artifact
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Audit release artifact secrets
        run: python3 scripts/audit-release-artifact.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarya-macos-release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
