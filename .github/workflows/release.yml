name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL
        uses: shogo82148/actions-setup-openssl@v1
        with:
          version: "3.4.1"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtsvg
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"
      - name: Build
        run: cmake --build build --config Release --target zarya_lrelease zarya zarya-helper
      - name: Package (unsigned by default)
        run: .\scripts\package-windows.ps1 -Configuration Release -OutputDir dist -SkipBuild -SkipSigning
      - name: Verify release artifact
        run: python scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Sign release (optional)
        if: env.SIGNING_ENABLED == 'true'
        env:
          ZARYA_WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          Write-Host "Signing enabled for tag release"
          .\scripts\package-windows.ps1 -Configuration Release -OutputDir dist -SkipBuild -Sign -SigningIdentity $env:ZARYA_WINDOWS_CERT_THUMBPRINT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarya-windows-release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
