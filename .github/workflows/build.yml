name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $roots = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL',
            'C:\OpenSSL-Win64'
          )
          $found = $null
          foreach ($r in $roots) {
            if (Test-Path "$r\include\openssl\ssl.h") {
              $found = $r
              "OPENSSL_ROOT_DIR=$r" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "OPENSSL_ROOT_DIR=$r"
              break
            }
          }
          if (-not $found) {
            throw 'OpenSSL headers not found after choco install'
          }
      - name: Install JPEG / ZLIB (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libjpeg-turbo:x64-windows zlib:x64-windows
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          "VCPKG_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VCPKG_PREFIX=$prefix"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_PREFIX_PATH="${VCPKG_PREFIX};${CMAKE_PREFIX_PATH}"
      # Do not use bash `export PATH=D:\...` — backslashes are escapes and break the PATH.
      - name: Build
        shell: pwsh
        run: |
          $parts = @()
          if ($env:QT_ROOT_DIR) { $parts += (Join-Path $env:QT_ROOT_DIR 'bin') }
          if ($env:OPENSSL_ROOT_DIR) { $parts += (Join-Path $env:OPENSSL_ROOT_DIR 'bin') }
          if ($env:VCPKG_PREFIX) { $parts += (Join-Path $env:VCPKG_PREFIX 'bin') }
          foreach ($p in $parts) {
            if ($p -and (Test-Path $p)) { $env:Path = "$p;$env:Path" }
          }
          Write-Host "PATH prefixes: $($parts -join '; ')"

          cmake --build build --target codegen_style
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $pwd 'build/desktop_app/codegen_style/codegen_style.exe'
          Write-Host "Smoke-testing $exe"
          & $exe 2>&1 | Out-Host
          $code = $LASTEXITCODE
          Write-Host "codegen_style smoke exit=$code"
          if ($code -eq 3221225781 -or $code -eq -1073741515) {
            Write-Host "STATUS_DLL_NOT_FOUND — dependents and search paths:"
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                Select-Object -First 1 -ExpandProperty FullName
              if ($dumpbin) { & $dumpbin /dependents $exe }
            }
            foreach ($p in $parts) {
              if (Test-Path $p) {
                Write-Host "--- $p ---"
                Get-ChildItem $p -Filter '*.dll' | Select-Object -ExpandProperty Name
              }
            }
            exit 1
          }

          cmake --build build --target zarya_lrelease zarya zarya-helper zarya_xray_config_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: ./build/zarya_xray_config_test.exe
      - name: Package (unsigned)
        run: .\scripts\package-windows.ps1 -Configuration Release -OutputDir dist -SkipBuild -SkipSigning
      - name: Verify release artifact
        run: python scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev zlib1g-dev libjpeg-dev libgl1-mesa-dev libegl1-mesa-dev \
            libglib2.0-dev libglib2.0-bin libdbus-1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-cursor0 libxcb-xinerama0 \
            gobject-introspection libgirepository1.0-dev \
            libboost-dev pkg-config \
            cmake ninja-build build-essential xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target zarya zarya_xray_config_test
      - name: Test
        run: ./build/zarya_xray_config_test
      - name: Package (unsigned)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/package-linux.sh --skip-build --skip-signing
      - name: Verify release artifact
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-linux-x64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL / cmake / ninja
        run: brew install cmake ninja openssl@3
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build --target zarya zarya_xray_config_test
      - name: Test
        run: ./build/zarya_xray_config_test
      - name: Package (unsigned)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/package-macos.sh --skip-build --skip-signing
      - name: Verify release artifact
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-macos-arm64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.*
          if-no-files-found: error
