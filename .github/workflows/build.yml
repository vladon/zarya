name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  libui-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check lib_ui boundary
        run: python3 scripts/check-libui-boundary.py
      - name: Require a shrinking allowlist
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-libui-boundary.py --previous-git-ref "${{ github.event.pull_request.base.sha }}"

  release-signing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check SignPath release contract
        run: python3 tests/release_signing_contract_test.py

  build-windows:
    runs-on: windows-latest
    env:
      GO_VERSION: "1.26.5"
      LCL_TOOLCHAIN_ROOT: '${{ github.workspace }}\build\tools\lcl-toolchain'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            src/runtime/embedded/xray/bridge/go.sum
            src/runtime/embedded/singbox/bridge/go.sum
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore pinned LCL toolchain
        uses: actions/cache@v5
        with:
          path: ${{ env.LCL_TOOLCHAIN_ROOT }}
          key: lcl-4.8-fpc-3.2.2-winlibs-16.1.0-r2
      - name: Bootstrap pinned LCL toolchain
        shell: pwsh
        run: .\prototypes\lcl\bootstrap-toolchain.ps1 -ToolRoot $env:LCL_TOOLCHAIN_ROOT
      - name: Verify vendored Go bridges
        working-directory: src/runtime/embedded/xray/bridge
        shell: pwsh
        run: |
          go version
          if ((go env GOVERSION) -ne "go$env:GO_VERSION") {
            throw "Expected Go $env:GO_VERSION"
          }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location ../../singbox/bridge
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Build one-file LCL runtime
        working-directory: prototypes/lcl
        shell: pwsh
        run: .\build.ps1
      - name: Run LCL tests
        working-directory: prototypes/lcl
        shell: pwsh
        run: .\test.ps1
      - name: Package exact LCL artifact
        working-directory: prototypes/lcl
        shell: pwsh
        run: .\package.ps1
      - name: Verify release artifact (LCL single-EXE contract)
        run: python scripts/verify-release-artifacts.py --artifact prototypes/lcl/dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip --expected-version ${{ steps.ver.outputs.version }} --windows-lcl-single-exe --require-checksum --allow-unsigned
      - name: Audit release artifact secrets
        run: python scripts/audit-release-artifact.py --artifact prototypes/lcl/dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            src/runtime/embedded/xray/bridge/go.sum
            src/runtime/embedded/singbox/bridge/go.sum
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev zlib1g-dev libjpeg-dev libgl1-mesa-dev libegl1-mesa-dev \
            libglib2.0-dev libglib2.0-bin libdbus-1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-cursor0 libxcb-xinerama0 \
            gobject-introspection libgirepository1.0-dev \
            libboost-dev pkg-config libkf5config-bin dbus-x11 \
            cmake ninja-build build-essential xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Verify vendored Go bridges
        working-directory: src/runtime/embedded/xray/bridge
        run: |
          go mod verify && go test ./...
          cd ../../singbox/bridge
          go mod verify && go test ./...
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target zarya zarya_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native KDE proxy smoke
        run: ./scripts/run-kde-proxy-smoke.sh build
      - name: Package (unsigned)
        run: ./scripts/package-linux.sh --skip-build --skip-signing
      - name: Verify release artifact
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Audit release artifact secrets
        run: python3 scripts/audit-release-artifact.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-linux-x64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            src/runtime/embedded/xray/bridge/go.sum
            src/runtime/embedded/singbox/bridge/go.sum
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL / cmake / ninja
        run: brew install cmake ninja openssl@3
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Verify vendored Go bridges
        working-directory: src/runtime/embedded/xray/bridge
        run: |
          go mod verify && go test ./...
          cd ../../singbox/bridge
          go mod verify && go test ./...
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build --target zarya zarya_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package (unsigned)
        run: ./scripts/package-macos.sh --skip-build --skip-signing
      - name: Verify release artifact
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Audit release artifact secrets
        run: python3 scripts/audit-release-artifact.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-macos-arm64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.*
          if-no-files-found: error
