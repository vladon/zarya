name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $roots = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL',
            'C:\OpenSSL-Win64'
          )
          $found = $null
          foreach ($r in $roots) {
            if (Test-Path "$r\include\openssl\ssl.h") {
              $found = $r
              "OPENSSL_ROOT_DIR=$r" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "OPENSSL_ROOT_DIR=$r"
              break
            }
          }
          if (-not $found) {
            throw 'OpenSSL headers not found after choco install'
          }
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"
      - name: Build
        run: cmake --build build --config Release --target zarya_lrelease zarya zarya-helper zarya_xray_config_test
      - name: Test
        run: ./build/Release/zarya_xray_config_test.exe
      - name: Package (unsigned)
        run: .\scripts\package-windows.ps1 -Configuration Release -OutputDir dist -SkipBuild -SkipSigning
      - name: Verify release artifact
        run: python scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-windows-x64-portable.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-tools-dev \
            libssl-dev zlib1g-dev libjpeg-dev libgl1-mesa-dev \
            libglib2.0-dev libglib2.0-bin libdbus-1-dev libxkbcommon-dev \
            gobject-introspection libgirepository1.0-dev \
            cmake build-essential xvfb
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target zarya zarya_xray_config_test
      - name: Test
        run: ./build/zarya_xray_config_test
      - name: Package (unsigned)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/package-linux.sh --skip-build --skip-signing
      - name: Verify release artifact
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.tar.gz --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-linux-x64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-linux-x64.*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_common import read_cmake_version; print(read_cmake_version()['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install OpenSSL / cmake
        run: brew install cmake openssl@3
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: ${{ runner.arch == 'ARM64' && 'clang_arm64' || 'clang_64' }}
      - name: Check translations
        run: python scripts/check-translations.py
      - name: Configure
        run: |
          cmake -S . -B build \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build --target zarya zarya_xray_config_test
      - name: Test
        run: ./build/zarya_xray_config_test
      - name: Package (unsigned)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/package-macos.sh --skip-build --skip-signing
      - name: Verify release artifact
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-artifacts.py --artifact dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.zip --expected-version ${{ steps.ver.outputs.version }} --stable-release --require-checksum --allow-unsigned
      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zarya-macos-arm64
          path: dist/Zarya-${{ steps.ver.outputs.version }}-macos-arm64.*
          if-no-files-found: error
